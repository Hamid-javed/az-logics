name: CI/CD > NeuroDrive WEB > Live

on:
  push:
    branches:
      - main

concurrency:
  group: main
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy NeuroDrive Web
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout the repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Configure SSH key
      - name: Configure SSH
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh/
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          cat >>~/.ssh/config <<END
          Host target
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/id_rsa
            LogLevel ERROR
            StrictHostKeyChecking no
          END

      # 3️⃣ Deploy and restart service
      - name: Deploy to server
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        shell: /usr/bin/bash -e {0}
        run: |
          echo "Deploying NeuroDrive Web..."
          ssh target '
            # Fix dubious ownership for Git
            git config --global --add safe.directory /var/www/NeuroDriveWeb

            cd /var/www/NeuroDriveWeb

            git fetch origin main
            git reset --hard origin/main

            # Load NVM and use Node
            export NVM_DIR="$HOME/.nvm"
            source "$NVM_DIR/nvm.sh"
            nvm use 24.13.0

            # Install dependencies & build
            npm install
            npm run build

            # Restart systemd service and reload nginx
            export SSH_PASSWORD='"'"$SSH_PASSWORD"'"'
            echo "$SSH_PASSWORD" | sudo -S systemctl restart neurodrive-web.service
            echo "$SSH_PASSWORD" | sudo -S systemctl reload nginx
            # Optional: check service status
            echo "$SSH_PASSWORD" | sudo -S systemctl status neurodrive-web.service --no-pager
          '
